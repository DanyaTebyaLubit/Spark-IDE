<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark IDE</title>

  <link rel="icon" type="image/png" href="assets/logos/SparkLogoRounded.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://js.puter.com/v2/"></script>

  <link rel="stylesheet" href="css/styles.css">

  <!-- Динамическая тема из settings.json -->
  <style id="dynamic-theme"></style>
</head>

<body>

  <header>
    <button class="icon-btn ghost" id="sidebarToggle" title="Проводник (Ctrl+B)"><i
        class="ri-side-bar-line"></i></button>

    <div class="logo">
      <img src="assets/logos/SparkLogoText.png" alt="Spark IDE" class="logo-img" style="height: 20px;">
    </div>

    <div class="actions">
      <button class="icon-btn ghost" id="globalSearchBtn" title="Поиск по проекту (Ctrl+Shift+F)"><i
          class="ri-search-line"></i></button>
      <button class="icon-btn ghost" id="commandPaletteBtn" title="Палитра команд (Ctrl+Shift+P)"><i
          class="ri-terminal-box-line"></i></button>
      <button class="icon-btn ghost" id="aiAssistantBtn" title="ИИ-помощник (Ctrl+Shift+A)"><i
          class="ri-sparkling-2-line"></i></button>
      <div class="divider"></div>

      <!-- Управление темами и проектами -->
      <button class="icon-btn ghost" id="themeToggle" title="Сменить тему (Default)"><i
          class="ri-sun-line"></i></button>
      <div class="divider"></div>

      <button class="icon-btn ghost" id="newProjectBtn" title="Новый проект"><i class="ri-file-add-line"></i></button>
      <button class="icon-btn ghost" id="openProjectBtn" title="Открыть проект из ZIP"><i
          class="ri-folder-open-line"></i></button>
      <input type="file" id="importProjectInput" accept=".zip" style="display:none">
      <button class="icon-btn ghost" id="saveProjectBtn" title="Сохранено (Автосохранение)"><i
          class="ri-save-3-line"></i></button>

      <div class="divider"></div>

      <button class="icon-btn ghost" id="formatBtn" title="Форматировать код (Shift+Alt+F)"><i
          class="ri-magic-line"></i>Формат</button>
      <button class="icon-btn ghost" id="previewToggle" title="Показать/скрыть предпросмотр (Ctrl+/)">
        <i class="ri-layout-right-line"></i>
      </button>
      <div class="divider"></div>
      <button id="runBtn" class="primary"><i class="ri-play-fill"></i>Запустить</button>
      <div class="dl-group">
        <button id="downloadBtn"><i class="ri-download-2-line"></i>Экспорт</button>
        <button id="downloadCaret" class="dl-caret" title="Другие варианты экспорта"><i
            class="ri-arrow-down-s-line"></i></button>
        <div class="dl-menu" id="dlMenu">
          <div class="dl-item" id="exportSiteItem"><i class="ri-global-line"></i>Скачать сайт (html+css+js)</div>
          <div class="dl-item" id="exportProjectItem"><i class="ri-folder-zip-line"></i>Сохранить проект (.zip)</div>
        </div>
      </div>
    </div>
  </header>

  <main id="mainGrid">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span><i class="ri-folder-3-line"></i>Проводник</span>
        <div class="sidebar-tools">
          <button class="icon-btn" id="newFileBtn" title="Новый файл"><i class="ri-file-add-line"></i></button>
          <button class="icon-btn" id="newFolderBtn" title="Новая папка"><i class="ri-folder-add-line"></i></button>
          <button class="icon-btn" id="uploadResourceBtn" title="Загрузить ресурс (картинку)"><i
              class="ri-upload-2-line"></i></button>
          <input type="file" id="uploadResourceInput" multiple style="display:none">
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <div class="editor-col" id="editorCol">
      <div class="tabbar" id="tabbar"></div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="code-wrap" id="codeWrap">
        <div class="gutter" id="gutter"></div>
        <div class="editor-container" id="editorContainer">
          <pre id="highlightArea" aria-hidden="true"><code></code></pre>
          <textarea id="editorArea" spellcheck="false" title="Автокомплит: Ctrl+Space"></textarea>
        </div>

        <!-- Панель поиска и замены -->
        <div class="find-panel" id="findPanel">
          <div class="find-row">
            <i class="ri-search-line"></i>
            <input type="text" id="findInput" placeholder="Найти" autocomplete="off">
            <span class="find-count" id="findCount"></span>
            <button class="icon-btn find-icon-btn" id="findCaseBtn" title="Учитывать регистр"><i
                class="ri-font-size"></i></button>
            <button class="icon-btn find-icon-btn" id="findPrevBtn" title="Предыдущее (Shift+Enter)"><i
                class="ri-arrow-up-line"></i></button>
            <button class="icon-btn find-icon-btn" id="findNextBtn" title="Следующее (Enter)"><i
                class="ri-arrow-down-line"></i></button>
            <button class="icon-btn find-icon-btn" id="findCloseBtn" title="Закрыть (Esc)"><i
                class="ri-close-line"></i></button>
          </div>
          <div class="find-row replace-row">
            <i class="ri-find-replace-line"></i>
            <input type="text" id="replaceInput" placeholder="Заменить на" autocomplete="off">
            <button class="find-text-btn" id="replaceOneBtn">Заменить</button>
            <button class="find-text-btn" id="replaceAllBtn">Заменить всё</button>
          </div>
        </div>

        <!-- Просмотрщик картинок -->
        <div class="image-preview" id="imagePreviewContainer">
          <img id="imagePreviewTag" src="" alt="Preview">
          <p id="imagePreviewName" class="img-name"></p>
        </div>

        <div class="empty-state" id="emptyState">
          <i class="ri-file-list-3-line"></i>
          <p>Выберите файл слева, чтобы начать редактирование</p>
        </div>
      </div>
      <div class="errbar" id="errbar"></div>
      <div class="status-bar" id="statusBar">
        <span class="status-left">
          <i class="ri-flashlight-line"></i>
          <span id="statusFile">Нет открытого файла</span>
          <span id="statusEntry"></span>
        </span>
        <span class="status-right">
          <span id="statusPos"></span>
          <button class="status-zoom-btn" id="zoomOutBtn" title="Уменьшить шрифт (Ctrl+-)"><i
              class="ri-zoom-out-line"></i></button>
          <span id="statusZoom">100%</span>
          <button class="status-zoom-btn" id="zoomInBtn" title="Увеличить шрифт (Ctrl+=)"><i
              class="ri-zoom-in-line"></i></button>
        </span>
      </div>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="preview-col" id="previewCol">
      <div class="preview-bar">
        <i class="ri-eye-line"></i>Предпросмотр
        <span class="live-dot" aria-hidden="true"></span>
      </div>
      <iframe id="preview"></iframe>
    </div>
  </main>

  <!-- Палитра команд -->
  <div class="modal-overlay" id="commandPalette">
    <div class="palette-box">
      <div class="palette-input-row">
        <i class="ri-terminal-box-line"></i>
        <input type="text" id="paletteInput" placeholder="Введите команду…" autocomplete="off">
      </div>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <!-- Глобальный поиск по проекту -->
  <div class="modal-overlay" id="globalSearchModal">
    <div class="gs-box">
      <div class="gs-input-row">
        <i class="ri-search-line"></i>
        <input type="text" id="globalSearchInput" placeholder="Поиск по всем файлам проекта…" autocomplete="off">
        <button class="icon-btn" id="globalSearchCloseBtn" title="Закрыть (Esc)"><i class="ri-close-line"></i></button>
      </div>
      <div class="gs-results" id="globalSearchResults"></div>
    </div>
  </div>

  <!-- ИИ-помощник -->
  <div class="modal-overlay" id="aiAssistantModal">
    <div class="ai-box">
      <div class="ai-header">
        <span><i class="ri-sparkling-2-line"></i>ИИ-помощник<span class="ai-badge">бесплатно · Puter.js</span></span>
        <div class="ai-header-actions">
          <button class="icon-btn" id="aiExportBtn" title="Экспортировать диалог (.md)"><i class="ri-download-2-line"></i></button>
          <button class="icon-btn" id="aiClearBtn" title="Очистить диалог"><i class="ri-delete-bin-line"></i></button>
          <button class="icon-btn" id="aiCloseBtn" title="Закрыть (Esc)"><i class="ri-close-line"></i></button>
        </div>
      </div>
      <div class="ai-messages" id="aiMessages">
        <div class="ai-empty">
          <i class="ri-sparkling-2-line"></i>
          <p>Спросите про Spark-синтаксис, попросите написать компонент или объяснить ошибку компиляции.</p>
        </div>
      </div>
      <div class="ai-input-row">
        <label class="ai-context-toggle" title="Приложить содержимое открытого файла к вопросу">
          <input type="checkbox" id="aiIncludeContext" checked>
          <span>Файл в контексте</span>
        </label>
        <textarea id="aiInput" rows="1" placeholder="Спросите что-нибудь…"></textarea>
        <button class="icon-btn" id="aiSendBtn" title="Отправить (Enter)"><i class="ri-send-plane-2-line"></i></button>
      </div>
    </div>
  </div>

  <script src="js/compiler.js"></script>
  <script src="js/vfs.js"></script>
  <script src="js/file-tree.js"></script>
  <script src="js/syntax-highlight.js"></script>
  <script src="js/editor-tabs.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/status-bar.js"></script>
  <script src="js/import-export.js"></script>
  <script src="js/dev-console.js"></script>
  <script src="js/find-replace.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/command-palette.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script src="js/resizer-shortcuts.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
